[package]
name = "firmware"
authors = ["Austyn Loehr <austynloehr@outlook.com>"]
edition = "2024"
version = "0.1.0"

[workspace]
members = ["crates/common", "crates/drivers", "crates/behavior"]

[dependencies]
drivers = { path = "crates/drivers" }
behavior = { path = "crates/behavior" }
common = { path = "crates/common" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
semihosting = "0.1.20"
embassy-stm32 = { version = "0.4.0", features = [
    "defmt",
    "stm32f412cg",
    "unstable-pac",
    "memory-x",
    "time-driver-any",
    "exti",
    "chrono",
] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-1_000_000",
] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
static_cell = "2.1.1"
embedded-can = "0.4.1"

[dev-dependencies]
defmt-test = "0.4.0"

# cargo build/run
[profile.dev]
# default is opt-level = '0', but that makes very
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# default is opt-level = '3', but that makes quite
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across
# crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
debug = 2
